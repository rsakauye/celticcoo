name: claude

# Claude Code builds a handoff issue on a branch and opens a pull request.
# Only Russell and the Grok bots app can start it. Claude never merges.
# Each job repeats the same allowlist and trigger check on purpose.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  usage-start:
    name: usage at start
    if: >-
      github.event.issue.number &&
      contains(fromJSON('["rsakauye","grokbot-rsakauye[bot]"]'), github.actor) &&
      ((github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
       (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/handoff-usage

      - name: Post usage
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CLAUDE_RUNS_5H_BUDGET: ${{ vars.CLAUDE_RUNS_5H_BUDGET }}
          CLAUDE_RUNS_7D_BUDGET: ${{ vars.CLAUDE_RUNS_7D_BUDGET }}
          CLAUDE_PLAN: ${{ vars.CLAUDE_PLAN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: node tools/handoff-usage/report.mjs --stage "Claude run started"

  claude:
    name: claude
    if: >-
      contains(fromJSON('["rsakauye","grokbot-rsakauye[bot]"]'), github.actor) &&
      ((github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
       (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
       (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
