name: Build & deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "!data/source_state.json"
      - "workers/**"
      - ".github/workflows/deploy.yml"
  schedule:
    # Daily rebuild so past events drop off "upcoming". 13:00 UTC = 7:00 a.m. MDT / 6:00 a.m. MST.
    - cron: "0 13 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (trees only, blobs on demand) so the sitemap can use real git last-modified dates.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://celticcoo.ca' }}
          BASE_PATH: /
          PUBLIC_KIT_FORM_ID: ${{ vars.KIT_FORM_ID }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          PUBLIC_SUBMIT_FORM_URL: ${{ vars.SUBMIT_FORM_URL }}
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
        run: |
          npm ci
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 7

      - name: Cloudflare secrets not set, skipping deploy
        if: env.CF_DEPLOY != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set. Built only; skipped the Cloudflare Pages deploy. See README."

      - name: IndexNow snapshot of the live sitemap (before deploy)
        if: env.CF_DEPLOY == 'true'
        continue-on-error: true
        run: node scripts/indexnow.mjs --snapshot

      # The API token needs Workers Scripts:Edit so this can create and update
      # celticcoo-mailer. BOOKING_TO is the verified Email Routing destination.
      # It is a GitHub secret and must never be committed. Pages deploy runs
      # after the Worker exists, because the Pages project binds to it.
      # Every mailer deploy must pass --var. Wrangler drops vars that are not
      # in the config, and this config does not name the destination.
      - name: Deploy mailer Worker (celticcoo-mailer)
        if: env.CF_DEPLOY == 'true'
        working-directory: workers/mailer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOOKING_TO: ${{ secrets.BOOKING_TO }}
        run: |
          if [ -z "${BOOKING_TO}" ]; then
            echo "::error::GitHub secret BOOKING_TO is empty. Set it to the verified Email Routing destination inbox. Do not put that address in the repo."
            exit 1
          fi
          npx --yes wrangler@4 deploy --var "BOOKING_TO:${BOOKING_TO}"

      # Substitutes the GitHub secret D1_DATABASE_ID into the checkout copy of
      # wrangler.jsonc, or removes the D1 binding when that secret is empty.
      # The real database id is never committed. See README.
      - name: Apply intake database id for this deploy
        if: env.CF_DEPLOY == 'true'
        working-directory: site
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: node ../scripts/prepare-pages-config.mjs wrangler.jsonc

      # Deploys to the existing Cloudflare Pages project "celticcoo" (create it once first; see README).
      - name: Deploy to Cloudflare Pages (celticcoo)
        if: env.CF_DEPLOY == 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=celticcoo --branch=main --commit-dirty=true

      - name: IndexNow ping (changed URLs only)
        if: success() && env.CF_DEPLOY == 'true'
        continue-on-error: true
        run: node scripts/indexnow.mjs

  # Separate from the Pages deploy. A missing secret skips this job's deploy
  # step and leaves Email Routing on its current rule. The daily site rebuild
  # does not redeploy this Worker.
  inbound-email:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: workers/inbound/package-lock.json

      - name: Test inbound email worker
        working-directory: workers/inbound
        run: |
          npm ci
          npm test

      # Does not apply D1 migrations and does not set an Email Routing address.
      # FORWARD_TO is a verified destination. It is a GitHub secret and must
      # never be committed. INBOUND_GITHUB_TOKEN is copied into the Worker
      # secret GITHUB_TOKEN. The Actions secret cannot be named GITHUB_TOKEN.
      - name: Deploy inbound email Worker (celticcoo-inbound)
        working-directory: workers/inbound
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORWARD_TO: ${{ secrets.FORWARD_TO }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          INBOUND_GITHUB_TOKEN: ${{ secrets.INBOUND_GITHUB_TOKEN }}
          INBOUND_ISSUES_REPO: ${{ vars.INBOUND_ISSUES_REPO }}
          REVIEW_SECRET: ${{ secrets.REVIEW_SECRET }}
          REVIEW_BASE_URL: ${{ vars.REVIEW_BASE_URL }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${FORWARD_TO}" ] || [ -z "${D1_DATABASE_ID}" ]; then
            echo "::notice::Skipping celticcoo-inbound deploy. Need CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, FORWARD_TO, and D1_DATABASE_ID. Email Routing is unchanged. See docs/inbound-email.md."
            exit 0
          fi
          node ../../scripts/prepare-inbound-config.mjs wrangler.jsonc
          secret_args=()
          secret_file=""
          cleanup() { if [ -n "${secret_file}" ]; then rm -f "$secret_file"; fi; }
          trap cleanup EXIT
          secret_file="$(mktemp)"
          if node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const secrets = {};
            const github = process.env.INBOUND_GITHUB_TOKEN || "";
            if (github) secrets.GITHUB_TOKEN = github;
            const review = process.env.REVIEW_SECRET || "";
            if (review && review.length >= 16 && review.length <= 200 && !/\s/.test(review)) secrets.REVIEW_SECRET = review;
            else if (review) console.error("REVIEW_SECRET is set but not usable. Approval links stay off.");
            if (Object.keys(secrets).length === 0) process.exit(2);
            writeFileSync(process.argv[1], JSON.stringify(secrets), { mode: 0o600 });
          ' "$secret_file"; then
            secret_args=(--secrets-file "$secret_file")
          else
            echo "::notice::INBOUND_GITHUB_TOKEN and REVIEW_SECRET are not set. Mail will still be forwarded and logged. GitHub issues and approval links stay off."
          fi
          var_args=(--var "FORWARD_TO:${FORWARD_TO}")
          # Issues stay off until this names a private repo that is not the public product repo.
          # RETENTION_PURGE is intentionally not passed, so the cron only logs counts.
          if [[ "${INBOUND_ISSUES_REPO}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] && [ "${INBOUND_ISSUES_REPO}" != "rsakauye/celticcoo" ]; then
            var_args+=(--var "INBOUND_ISSUES_REPO:${INBOUND_ISSUES_REPO}")
          else
            echo "::notice::INBOUND_ISSUES_REPO is unset or is the public repo. Inbound GitHub issues stay off."
          fi
          if [[ "${REVIEW_BASE_URL}" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            var_args+=(--var "REVIEW_BASE_URL:${REVIEW_BASE_URL}")
          elif [ -n "${REVIEW_BASE_URL}" ]; then
            echo "::notice::REVIEW_BASE_URL must be an https origin with no path. Approval links stay off."
          fi
          npx --yes wrangler@4 deploy "${var_args[@]}" "${secret_args[@]}"
