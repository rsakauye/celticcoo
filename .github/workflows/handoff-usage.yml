name: handoff-usage
# Posts the usage snapshot when an issue gets the ai-handoff label,
# and runs the script's unit tests on pull requests that touch it.
on:
  issues:
    types: [labeled]
  pull_request:
    paths:
      - tools/handoff-usage/**
      - .github/workflows/handoff-usage.yml
permissions: {}
jobs:
  snapshot:
    name: snapshot
    if: github.event_name == 'issues' && github.event.label.name == 'ai-handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/handoff-usage
      - name: Post usage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CLAUDE_RUNS_5H_BUDGET: ${{ vars.CLAUDE_RUNS_5H_BUDGET }}
          CLAUDE_RUNS_7D_BUDGET: ${{ vars.CLAUDE_RUNS_7D_BUDGET }}
          CLAUDE_PLAN: ${{ vars.CLAUDE_PLAN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: node tools/handoff-usage/report.mjs --stage "handoff filed"
  test:
    name: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unit tests
        run: node --test tools/handoff-usage/*.test.mjs
