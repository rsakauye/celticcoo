name: Weekly source check

on:
  schedule:
    # Mondays 14:00 UTC = 8:00 a.m. MDT / 7:00 a.m. MST.
    - cron: "0 14 * * 1"
  workflow_dispatch:

concurrency:
  group: source-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test the source checker
        run: python scripts/test_check_sources.py

      - name: Re-check source pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_sources.py --open-issue --report source-check-report.md

      - name: Save snapshot
        run: |
          git config user.name "celticcoo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source_state.json
          if git diff --cached --quiet; then echo "No snapshot changes"; exit 0; fi
          git commit -m "chore: weekly source snapshot $(TZ=America/Edmonton date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
