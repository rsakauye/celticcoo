name: Weekly club link check

on:
  schedule:
    # Mondays 15:00 UTC = 9:00 a.m. MDT / 8:00 a.m. MST.
    # This cron is also link-check/sites/celticcoo.json "schedule". GitHub Actions cannot read that file.
    - cron: "0 15 * * 1"
  workflow_dispatch:

concurrency:
  group: club-link-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"

      - name: Test the link checker
        run: node --test link-check/test

      - name: Check club websites
        # The runner context is not available in a job-level env block, so the report path uses the RUNNER_TEMP environment variable.
        run: node link-check/src/cli.js --config link-check/sites/celticcoo.json --report "$RUNNER_TEMP/club-link-check.md"

      - name: Commit status file on the bot branch
        id: commit
        run: |
          set -euo pipefail
          file="data/groups_link_status.json"
          branch="bot/weekly-club-link-check"
          snapshot="$(mktemp)"
          cp "$file" "$snapshot"
          git config user.name "celticcoo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git fetch origin "$branch" || true
          git checkout -- "$file" || true
          git checkout -B "$branch" origin/main
          cp "$snapshot" "$file"
          git add -- "$file"
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          names="$(git diff --cached --name-only)"
          if [ "$names" != "$file" ]; then
            echo "Refusing to commit unexpected files: $names"
            exit 1
          fi
          checked="$(node --input-type=module -e "import fs from 'node:fs'; const s=JSON.parse(fs.readFileSync('data/groups_link_status.json','utf8')); if(!s.checked_on) process.exit(1); process.stdout.write(s.checked_on)")"
          git commit -m "chore: weekly club link check ${checked}"
          if git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
            git push --force-with-lease="refs/heads/${branch}:refs/remotes/origin/${branch}" origin "HEAD:${branch}"
          else
            git push -u origin "HEAD:${branch}"
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.commit.outputs.pushed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node link-check/src/cli.js --config link-check/sites/celticcoo.json --open-pr --report "$RUNNER_TEMP/club-link-check.md"
